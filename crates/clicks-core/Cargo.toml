[package]
name = "clicks-core"
description = "Sans-IO protocol implementation for the Clicks Power Keyboard companion service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
default = []
serde = ["dep:serde"]
firmware = ["serde", "dep:serde_json", "dep:sha2"]
