[workspace]
resolver = "2"
members = ["crates/clicks-core", "crates/clicks-ble", "crates/clicks-cli", "crates/clicks-ffi", "crates/clicks-wasm", "app/src-tauri"]
default-members = ["crates/clicks-core", "crates/clicks-ble", "crates/clicks-cli", "crates/clicks-ffi", "crates/clicks-wasm"]


[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
clicks-core = { path = "crates/clicks-core" }
clicks-ble = { path = "crates/clicks-ble" }
btleplug = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
uuid = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
